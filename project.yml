name: EdgeWebRTCDemo
options:
  bundleIdPrefix: com.nabto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  NabtoEdgeClient:
    url: https://github.com/nabto/edge-client-swift
    from: 4.0.2
  NabtoEdgeIamUtil:
    url: https://github.com/nabto/edge-iamutil-swift
    from: 2.0.1
  NabtoEdgeClientWebRTC:
    # No tagged release supports edge-client-swift 4.x yet.
    url: https://github.com/nabto/edge-client-swift-webrtc
    branch: update_edge_client_swift_4

targets:
  EdgeWebRTCDemo:
    type: application
    platform: iOS
    sources:
      - path: EdgeWebRTCDemo
    info:
      path: EdgeWebRTCDemo/Info.plist
      properties:
        CFBundleDisplayName: Edge WebRTC Demo
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: "Used to discover Nabto Edge devices on your local network via mDNS."
        NSBonjourServices:
          - _nabto._udp
        NSCameraUsageDescription: "Used to scan QR-encoded pairing strings."
        NSMicrophoneUsageDescription: "Used for two-way audio with the paired device."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabto.EdgeWebRTCDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: E55K8RCV2E
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: NabtoEdgeClient
        product: NabtoEdgeClient
      - package: NabtoEdgeIamUtil
        product: NabtoEdgeIamUtil
      - package: NabtoEdgeClientWebRTC
        product: NabtoEdgeClientWebRTC

  EdgeWebRTCDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EdgeWebRTCDemoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabto.EdgeWebRTCDemoTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: E55K8RCV2E
    dependencies:
      - target: EdgeWebRTCDemo

schemes:
  EdgeWebRTCDemo:
    build:
      targets:
        EdgeWebRTCDemo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EdgeWebRTCDemoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  EdgeWebRTCDemo (No Debug):
    build:
      targets:
        EdgeWebRTCDemo: all
    run:
      config: Debug
      debugEnabled: false
    test:
      config: Debug
      targets:
        - EdgeWebRTCDemoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
